<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ client.client_name }} - ELRS Archives</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/logo.png') }}?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #525252; border-radius: 10px; }
        .masonry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .zoom-active { transform: scale(1.5); cursor: zoom-out !important; }
    </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 font-sans min-h-screen transition-colors duration-300 pb-24">

    <!-- Header -->
    <nav class="sticky top-0 z-40 bg-white/90 dark:bg-neutral-950/90 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 relative flex items-center justify-between">
            
            <!-- Left: Back Button & Brand Title -->
            <div class="flex items-center gap-4 z-10">
                <a href="{{ url_for('index') }}" class="text-neutral-500 hover:text-black dark:hover:text-white transition flex items-center gap-2 text-xs font-mono uppercase tracking-widest group">
                    <i class="fa-solid fa-arrow-left-long group-hover:-translate-x-1 transition-transform"></i>
                    <span class="hidden sm:inline">Return</span>
                </a>
                <div class="text-xl font-serif font-bold tracking-tighter hidden lg:block border-l border-neutral-300 dark:border-neutral-700 pl-4 ml-2">
                    ELRS Photography
                </div>
            </div>
            
            <!-- Center: Client Info -->
            <div class="absolute left-1/2 -translate-x-1/2 text-center w-full sm:w-auto pointer-events-none">
                <h1 class="text-lg md:text-xl font-serif font-bold tracking-tighter">{{ client.client_name }}</h1>
                <p class="text-[10px] font-mono tracking-widest uppercase text-neutral-500 mt-1">Client Archive: {{ client.special_id }}</p>
            </div>
            
            <!-- Right: Review Button & Theme Toggle -->
            <div class="flex items-center gap-4 ml-auto z-10 relative">
                <!-- NEW: Review Button in Nav -->
                <button onclick="openReviewPage()" id="nav-review-btn" class="bg-black dark:bg-white text-white dark:text-black text-[10px] font-mono uppercase tracking-widest px-4 py-2 hover:opacity-80 transition shadow-sm flex items-center gap-2">
                    Review <span id="nav-total-count" class="bg-neutral-800 dark:bg-neutral-200 text-white dark:text-black rounded-full px-2 py-0.5 ml-1">0</span>
                </button>
                <button onclick="toggleTheme()" class="text-neutral-500 hover:text-black dark:hover:text-white transition">
                    <i class="fa-solid fa-circle-half-stroke text-lg"></i>
                </button>
            </div>
        </div>
        
        <!-- Event Tabs (Hidden during Review) -->
        <div id="event-tabs-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto gap-6 py-3 scrollbar-hide mt-2 transition-all duration-300">
            {% for event in client.events %}
                <button onclick="loadEvent('{{ event.event_id }}', '{{ event.folder_id }}', this, '{{ event.event_name }}')" 
                        class="event-tab text-xs font-mono uppercase tracking-widest whitespace-nowrap pb-1 border-b-2 border-transparent text-neutral-500 hover:text-black dark:hover:text-white transition-colors flex items-center gap-2"
                        data-event-id="{{ event.event_id }}">
                    {{ event.event_name }}
                    <!-- Tab-specific count -->
                    <span class="tab-count bg-neutral-200 dark:bg-neutral-800 text-[9px] px-1.5 py-0.5 rounded-full hidden" data-count-for="{{ event.event_id }}">0</span>
                </button>
            {% else %}
                <span class="text-xs font-mono uppercase text-neutral-500">No events found.</span>
            {% endfor %}
        </div>
    </nav>

    <!-- VIEWS CONTAINER -->
    <div id="view-container">
        
        <!-- 1. GALLERY VIEW -->
        <main id="gallery-view" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 transition-opacity duration-300">
            <!-- Save Status Indicator -->
            <div class="flex justify-end mb-4 h-4">
                <span id="save-status" class="text-[10px] font-mono uppercase tracking-widest text-neutral-400 opacity-0 transition-opacity duration-300 flex items-center gap-1">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Saving...
                </span>
            </div>

            <div id="gallery-grid" class="masonry-grid">
                <!-- Images injected here -->
            </div>
            
            <div id="loading-sentinel" class="w-full text-center py-10 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-neutral-400"></i>
                <p class="text-[10px] font-mono tracking-widest uppercase text-neutral-500 mt-3">Fetching Archives</p>
            </div>
        </main>

        <!-- 2. FULL PAGE REVIEW VIEW (Hidden by default) -->
        <main id="review-view" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden transition-opacity duration-300">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-neutral-200 dark:border-neutral-800 pb-6 gap-4">
                <div>
                    <h2 class="text-3xl font-serif font-bold text-black dark:text-white flex items-center gap-4">
                        <button onclick="closeReviewPage()" class="text-neutral-400 hover:text-black dark:hover:text-white transition text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                        Review Selections
                    </h2>
                    <p class="text-xs font-mono uppercase text-neutral-500 mt-2 ml-9">Total Selected: <span id="review-count-display" class="text-black dark:text-white font-bold text-sm">0</span></p>
                </div>
                <button onclick="confirmAndSubmit()" id="final-submit-btn" class="text-xs font-mono uppercase tracking-widest bg-green-600 text-white px-8 py-4 hover:bg-green-500 transition shadow-lg w-full md:w-auto">
                    Confirm & Submit to Studio
                </button>
            </div>

            <!-- Grouped by folders injected here -->
            <div id="review-content" class="space-y-12">
                <div class="w-full text-center py-20" id="review-loading">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-neutral-400"></i>
                    <p class="text-xs font-mono tracking-widest uppercase text-neutral-500 mt-4">Compiling your selections...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-neutral-50/95 dark:bg-neutral-950/95 z-50 hidden flex-col items-center justify-center transition-colors duration-300">
        <div class="absolute top-6 left-6 z-10 flex items-center bg-white/50 dark:bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-md border border-neutral-200 dark:border-neutral-800">
            <i class="fa-regular fa-image text-neutral-500 mr-2 text-xs"></i>
            <span id="lightbox-filename" class="text-xs font-mono tracking-widest uppercase text-black dark:text-white font-bold"></span>
        </div>

        <div class="absolute top-6 right-6 flex items-center gap-6 z-10">
            <span id="lightbox-counter" class="text-xs font-mono tracking-widest uppercase text-neutral-500 mt-1 hidden sm:block"></span>
            
            <button id="lightbox-select-btn" onclick="toggleLightboxSelection()" class="border px-4 py-2 text-xs font-mono uppercase tracking-widest transition-colors flex items-center gap-2">
                <i class="fa-solid fa-check"></i> <span id="lightbox-select-text">Select</span>
            </button>

            <button onclick="toggleZoom()" class="text-neutral-500 hover:text-black dark:hover:text-white transition"><i class="fa-solid fa-magnifying-glass-plus text-xl"></i></button>
            <button onclick="closeLightbox()" class="text-neutral-500 hover:text-black dark:hover:text-white transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        
        <button onclick="prevImage()" class="absolute left-6 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-black dark:hover:text-white transition text-3xl p-4 z-10"><i class="fa-solid fa-angle-left"></i></button>
        
        <div class="w-full h-full max-w-5xl max-h-[85vh] flex items-center justify-center p-4 overflow-auto relative">
            <div class="relative inline-block max-w-full max-h-full">
                <img id="lightbox-img" src="" alt="Full Preview" class="max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300" onclick="toggleZoom()">
            </div>
        </div>
        
        <button onclick="nextImage()" class="absolute right-6 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-black dark:hover:text-white transition text-3xl p-4 z-10"><i class="fa-solid fa-angle-right"></i></button>
    </div>

    <script>
        const specialId = "{{ client.special_id }}";
        let currentEventId = null;
        let currentFolderId = null;
        let currentEventName = null;
        let nextPageToken = null;
        let isLoading = false;
        
        // State Management
        let selectedFileIdsByEvent = {}; // { eventId: Set(fileId1, fileId2) }
        let currentImages = []; 
        let currentLightboxIndex = 0;
        let autoSaveTimeout = null; 
        
        // NEW: AbortController to kill requests when tabs are switched quickly
        let fetchAbortController = null;

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && nextPageToken && !isLoading) {
                fetchImages(currentFolderId, nextPageToken);
            }
        }, { rootMargin: '200px' });

        document.addEventListener('DOMContentLoaded', async () => {
            // First, fetch ALL selections for ALL events to initialize state globally
            await initializeAllSelections();
            
            const firstTab = document.querySelector('.event-tab');
            if (firstTab) firstTab.click();
            
            document.addEventListener('keydown', (e) => {
                if (!document.getElementById('lightbox').classList.contains('hidden')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === 'ArrowLeft') prevImage();
                }
            });
        });

        // Fetch selections for all events upfront
        async function initializeAllSelections() {
            try {
                const res = await fetch(`/api/selections/all/${specialId}`);
                if (res.ok) {
                    const data = await res.json();
                    // Initialize sets
                    document.querySelectorAll('.event-tab').forEach(tab => {
                        const evtId = tab.dataset.eventId;
                        selectedFileIdsByEvent[evtId] = new Set(data.selections[evtId] || []);
                    });
                    updateAllCounters();
                }
            } catch (err) {
                console.error("Failed to init selections", err);
            }
        }

        async function loadEvent(eventId, folderId, tabElement, eventName) {
            if (currentEventId === eventId) return;

            // Kill any ongoing fetching from previous tab
            if (fetchAbortController) {
                fetchAbortController.abort();
            }
            
            // Reset UI
            document.querySelectorAll('.event-tab').forEach(el => {
                el.classList.remove('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
                el.classList.add('border-transparent', 'text-neutral-500');
            });
            tabElement.classList.add('border-black', 'dark:border-white', 'text-black', 'dark:text-white');
            tabElement.classList.remove('border-transparent', 'text-neutral-500');

            document.getElementById('gallery-grid').innerHTML = '';
            currentEventId = eventId;
            currentFolderId = folderId;
            currentEventName = eventName;
            nextPageToken = null;
            currentImages = [];
            isLoading = false;

            // Ensure Set exists
            if(!selectedFileIdsByEvent[currentEventId]) {
                selectedFileIdsByEvent[currentEventId] = new Set();
            }

            fetchImages(folderId);
        }

        async function fetchImages(folderId, pageToken = '') {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loading-sentinel').classList.remove('hidden');

            fetchAbortController = new AbortController();
            const signal = fetchAbortController.signal;

            const url = `/api/images/${folderId}${pageToken ? `?pageToken=${pageToken}` : ''}`;
            
            try {
                const response = await fetch(url, { signal });
                const data = await response.json();
                
                nextPageToken = data.next_page_token;
                renderGrid(data.images);
                
                if (nextPageToken) {
                    observer.observe(document.getElementById('loading-sentinel'));
                } else {
                    observer.disconnect();
                    document.getElementById('loading-sentinel').classList.add('hidden');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Fetch aborted for previous tab');
                } else {
                    console.error("Error fetching images:", error);
                }
            } finally {
                isLoading = false;
            }
        }

        function renderGrid(images) {
            const grid = document.getElementById('gallery-grid');
            const currentSelections = selectedFileIdsByEvent[currentEventId] || new Set();

            images.forEach((img) => {
                const globalIndex = currentImages.length;
                currentImages.push(img);
                const isSelected = currentSelections.has(img.id);
                
                const card = document.createElement('div');
                card.className = "relative group aspect-[4/5] bg-neutral-200 dark:bg-neutral-800 overflow-hidden file-card-" + img.id;
                card.innerHTML = `
                    <img src="${img.thumbnail}" alt="${img.name}" loading="lazy" 
                         onerror="this.onerror=null; this.src='${img.full}';" 
                         class="w-full h-full object-cover cursor-pointer transition-transform duration-700 group-hover:scale-105" 
                         onclick="openLightbox(${globalIndex})">
                    <div class="absolute top-3 right-3 z-10">
                        <button data-file-id="${img.id}" onclick="toggleGridSelection('${img.id}', '${currentEventId}')" class="selection-btn w-8 h-8 flex items-center justify-center border-2 transition-all ${isSelected ? 'bg-black border-black text-white dark:bg-white dark:border-white dark:text-black' : 'border-white/70 bg-black/20 text-transparent hover:border-white'}">
                            <i class="fa-solid fa-check text-sm"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleGridSelection(fileId, evtId) {
            const evIdToUse = evtId || currentEventId;
            const targetSet = selectedFileIdsByEvent[evIdToUse];

            if (targetSet.has(fileId)) {
                targetSet.delete(fileId);
            } else {
                targetSet.add(fileId);
            }
            
            // Sync visual button state if it exists in DOM
            const btnElement = document.querySelector(`.file-card-${fileId} .selection-btn`);
            if(btnElement) {
                if (targetSet.has(fileId)) {
                    btnElement.className = "selection-btn w-8 h-8 flex items-center justify-center border-2 bg-black border-black text-white dark:bg-white dark:border-white dark:text-black transition-all";
                } else {
                    btnElement.className = "selection-btn w-8 h-8 flex items-center justify-center border-2 border-white/70 bg-black/20 text-transparent hover:border-white transition-all";
                }
            }
            
            updateAllCounters();
            triggerAutoSave(evIdToUse);
        }

        function updateAllCounters() {
            let grandTotal = 0;
            
            // Update individual tab counts
            for (const [evtId, selectionSet] of Object.entries(selectedFileIdsByEvent)) {
                const count = selectionSet.size;
                grandTotal += count;
                
                const tabBadge = document.querySelector(`.tab-count[data-count-for="${evtId}"]`);
                if (tabBadge) {
                    if (count > 0) {
                        tabBadge.innerText = count;
                        tabBadge.classList.remove('hidden');
                    } else {
                        tabBadge.classList.add('hidden');
                    }
                }
            }

            // Update main Nav button count
            const navTotalEl = document.getElementById('nav-total-count');
            if (navTotalEl) {
                navTotalEl.innerText = grandTotal;
                if(grandTotal > 0) {
                    navTotalEl.classList.add('bg-green-500', 'text-white');
                    navTotalEl.classList.remove('bg-neutral-800', 'dark:bg-neutral-200');
                } else {
                    navTotalEl.classList.remove('bg-green-500', 'text-white');
                    navTotalEl.classList.add('bg-neutral-800', 'dark:bg-neutral-200');
                }
            }
            
            // Update Review Page count
            const reviewCountEl = document.getElementById('review-count-display');
            if(reviewCountEl) reviewCountEl.innerText = grandTotal;
        }

        function triggerAutoSave(evtId) {
            const statusEl = document.getElementById('save-status');
            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
                statusEl.classList.remove('opacity-0');
            }

            if (autoSaveTimeout) clearTimeout(autoSaveTimeout);

            autoSaveTimeout = setTimeout(async () => {
                try {
                    const response = await fetch('/api/selections/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            special_id: specialId,
                            event_id: evtId,
                            selected_ids: Array.from(selectedFileIdsByEvent[evtId])
                        })
                    });
                    
                    if (response.ok && statusEl) {
                        statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
                        setTimeout(() => { statusEl.classList.add('opacity-0'); }, 2000);
                    }
                } catch (error) {
                    if (statusEl) statusEl.innerText = "Error Saving";
                }
            }, 500); 
        }

        // --- Lightbox Functions ---
        function openLightbox(index) {
            currentLightboxIndex = index;
            const imgData = currentImages[index];
            const imgEl = document.getElementById('lightbox-img');
            
            imgEl.src = imgData.thumbnail; 
            const fullImage = new Image();
            fullImage.src = imgData.full;
            fullImage.onload = () => { if(currentLightboxIndex === index) imgEl.src = imgData.full; };

            document.getElementById('lightbox-counter').innerText = `${index + 1} / ${currentImages.length}`;
            document.getElementById('lightbox-filename').innerText = imgData.name;
            
            updateLightboxSelectBtn(imgData.id);

            document.getElementById('lightbox').classList.remove('hidden');
            document.getElementById('lightbox').classList.add('flex');
            document.body.style.overflow = 'hidden'; 
        }

        function toggleLightboxSelection() {
            const imgId = currentImages[currentLightboxIndex].id;
            toggleGridSelection(imgId, currentEventId); 
            updateLightboxSelectBtn(imgId); 
        }

        function updateLightboxSelectBtn(fileId) {
            const btn = document.getElementById('lightbox-select-btn');
            const text = document.getElementById('lightbox-select-text');
            const targetSet = selectedFileIdsByEvent[currentEventId];
            
            if (targetSet && targetSet.has(fileId)) {
                btn.classList.add('bg-black', 'text-white', 'dark:bg-white', 'dark:text-black', 'border-black', 'dark:border-white');
                btn.classList.remove('text-neutral-500', 'border-neutral-500');
                text.innerText = "Selected";
            } else {
                btn.classList.remove('bg-black', 'text-white', 'dark:bg-white', 'dark:text-black', 'border-black', 'dark:border-white');
                btn.classList.add('text-neutral-500', 'border-neutral-500');
                text.innerText = "Select";
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.getElementById('lightbox').classList.remove('flex');
            document.body.style.overflow = '';
            document.getElementById('lightbox-img').classList.remove('zoom-active');
        }

        function nextImage() {
            if (currentLightboxIndex < currentImages.length - 1) {
                document.getElementById('lightbox-img').classList.remove('zoom-active');
                openLightbox(currentLightboxIndex + 1);
            }
        }

        function prevImage() {
            if (currentLightboxIndex > 0) {
                document.getElementById('lightbox-img').classList.remove('zoom-active');
                openLightbox(currentLightboxIndex - 1);
            }
        }

        function toggleZoom() { document.getElementById('lightbox-img').classList.toggle('zoom-active'); }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        // --- FULL PAGE REVIEW LOGIC ---
        async function openReviewPage() {
            let total = 0;
            for (const s of Object.values(selectedFileIdsByEvent)) total += s.size;
            
            if (total === 0) {
                alert("Please select at least one image before reviewing.");
                return;
            }

            // Hide Gallery, Show Review
            document.getElementById('gallery-view').classList.add('hidden');
            document.getElementById('event-tabs-container').classList.add('hidden');
            document.getElementById('review-view').classList.remove('hidden');
            document.getElementById('nav-review-btn').classList.add('hidden');
            
            const reviewContent = document.getElementById('review-content');
            reviewContent.innerHTML = `
                <div class="w-full text-center py-20" id="review-loading">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-neutral-400"></i>
                    <p class="text-xs font-mono tracking-widest uppercase text-neutral-500 mt-4">Compiling your final selections...</p>
                </div>`;

            // Fetch actual full details for selected images from backend
            try {
                const response = await fetch(`/api/selections/details/${specialId}`);
                const eventData = await response.json();
                
                reviewContent.innerHTML = ''; // Clear loading
                
                for (const event of eventData.events) {
                    if (event.images.length === 0) continue;
                    
                    const section = document.createElement('div');
                    section.className = "mb-12";
                    
                    let imagesHTML = event.images.map(img => `
                        <div class="relative aspect-[4/5] bg-neutral-200 dark:bg-neutral-800 overflow-hidden group review-card-${img.id}">
                            <img src="${img.thumbnail}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <button onclick="removeFromReview('${img.id}', '${event.event_id}')" class="bg-red-600 text-white text-[10px] font-mono tracking-widest uppercase px-6 py-3 hover:bg-red-500 transition">Remove</button>
                            </div>
                        </div>
                    `).join('');

                    section.innerHTML = `
                        <h3 class="text-xs font-mono uppercase tracking-widest text-neutral-500 mb-4 border-b border-neutral-200 dark:border-neutral-800 pb-2">${event.event_name} (${event.images.length})</h3>
                        <div class="masonry-grid">${imagesHTML}</div>
                    `;
                    reviewContent.appendChild(section);
                }
            } catch (e) {
                reviewContent.innerHTML = `<p class="text-red-500">Failed to load selections. Please try again.</p>`;
            }
        }

        function closeReviewPage() {
            document.getElementById('review-view').classList.add('hidden');
            document.getElementById('gallery-view').classList.remove('hidden');
            document.getElementById('event-tabs-container').classList.remove('hidden');
            document.getElementById('nav-review-btn').classList.remove('hidden');
        }

        function removeFromReview(fileId, evtId) {
            toggleGridSelection(fileId, evtId); // De-select and auto-save
            
            // Remove the card from DOM
            const card = document.querySelector(`.review-card-${fileId}`);
            if (card) card.remove();
            
            // Check if everything is empty
            let total = 0;
            for (const s of Object.values(selectedFileIdsByEvent)) total += s.size;
            if (total === 0) {
                closeReviewPage();
            }
        }

        async function confirmAndSubmit() {
            if(!confirm("Are you ready to finalize and send these selections to the studio?")) return;
            
            const btn = document.getElementById('final-submit-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> SUBMITTING...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/selections/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ special_id: specialId })
                });
                
                if (response.ok) {
                    btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> SUBMITTED SUCCESSFULLY';
                    btn.classList.remove('bg-green-600', 'hover:bg-green-500');
                    btn.classList.add('bg-black', 'dark:bg-white', 'text-white', 'dark:text-black');
                    alert("Thank you! Your final selections have been received.");
                    setTimeout(() => { window.location.href = "/"; }, 2000);
                } else {
                    throw new Error("Submission failed");
                }
            } catch (error) {
                btn.innerText = "ERROR - TRY AGAIN";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
